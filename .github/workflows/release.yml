name: Release
run-name: Deploy CI ${{ github.event.workflow_run.id || inputs.source-run-id }}

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      source-run-id:
        description: Successful main CI run ID to deploy
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Zeppelin Worker
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.event != 'pull_request')
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@ad43150de3a2be2fa464b5cd2f921dc4fa9f8f0f
    with:
      expected-workflow-path: .github/workflows/ci.yml
      expected-workflow-name: CI
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || inputs.source-run-id }}
      allowed-source-events: push,workflow_dispatch
      package-manager: npm
      runtime-version: "11.19.0"
      node-version: "26.8.1"
      install-policy: project
      build-command: |
        npm run build
        npm run deploy:check
      wrangler-version: "4.135.0"
      environment: production
      concurrency-group: zeppelin-production
      timeout-minutes: 15
      verify-command: npm run verify:production
      verify-retries: 12
      verify-retry-seconds: 10
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
