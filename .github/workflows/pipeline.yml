name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    name: Deploy Zeppelin Worker
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
    with:
      package-manager: npm
      runtime-version: "11.19.0"
      node-version: "26.12.1"
      install-policy: project
      artifact-name: zeppelin-static-site
      artifact-path: dist
      environment: production
      concurrency-group: zeppelin-production
      timeout-minutes: 15
      verify-command: npm run verify:production
      verify-retries: 12
      verify-retry-seconds: 10
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
